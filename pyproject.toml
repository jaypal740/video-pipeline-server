[project]
name = "video-pipeline"
version = "0.1.0"
description = "JamWise educational music video pipeline"
authors = [
    {name = "jaypal740",email = "jaypalgohil740@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic (>=2.14.1,<3.0.0)", "pydantic-settings (>=2.16.1,<3.0.0)", "sqlalchemy (>=2.1.6,<3.0.0)", "dependency-injector (>=4.49.1,<5.0.0)", "typer (>=0.27.3,<0.28.0)", "python-dotenv (>=1.2.4,<2.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls real providers; needs API keys and PIPELINE_LIVE=1"]
